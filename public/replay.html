<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Strategy Chess — Replays</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/imgs/ui/logo.png">
    <link rel="stylesheet" href="/brand.css">
    <meta name="description" content="Strategy Chess — xem lại các trận đã lưu.">
    <link rel="canonical" href="__OG_URL__">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Strategy Chess">
    <meta property="og:locale" content="vi_VN">
    <meta property="og:locale:alternate" content="en_US">
    <meta property="og:url" content="__OG_URL__">
    <meta property="og:title" content="Strategy Chess — Replays">
    <meta property="og:description" content="Strategy Chess — xem lại các trận đã lưu.">
    <meta property="og:image" content="__OG_ORIGIN__/imgs/ui/strategy-chess-og-image.png">
    <meta property="og:image:secure_url" content="__OG_ORIGIN__/imgs/ui/strategy-chess-og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1536">
    <meta property="og:image:height" content="1024">
    <meta property="og:image:alt" content="Strategy Chess">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Strategy Chess — Replays">
    <meta name="twitter:description" content="Strategy Chess — xem lại các trận đã lưu.">
    <meta name="twitter:image" content="__OG_ORIGIN__/imgs/ui/strategy-chess-og-image.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-white min-h-screen">
    <div class="container mx-auto px-3 py-3">
        <div class="flex items-center justify-between gap-3 mb-3">
            <div class="flex items-center gap-2 min-w-0">
                <a href="index.html" class="bg-gray-700 hover:bg-gray-600 text-white text-xs font-bold py-1.5 px-2 rounded whitespace-nowrap" data-i18n="nav.back">← Home</a>
                <img src="/imgs/ui/logo.png" alt="Strategy Chess" class="site-logo-sm">
            </div>
            <div class="flex items-center gap-1">
                <button type="button" data-lang-set="vi" class="px-2 py-1 rounded text-xs font-bold bg-gray-700">VI</button>
                <button type="button" data-lang-set="en" class="px-2 py-1 rounded text-xs font-bold bg-gray-700">EN</button>
                <button type="button" data-open-rules class="bg-yellow-600 hover:bg-yellow-500 text-gray-900 font-bold px-2 py-1 rounded text-xs" data-i18n="nav.rules">Rules</button>
            </div>
        </div>

        <h1 class="text-xl font-bold text-yellow-400 mb-3" data-i18n="replay.title">Watch replays</h1>

        <div id="replay-list" class="bg-gray-800/90 rounded-lg p-4 border border-gray-600 shadow-lg space-y-3">
            <div class="text-center text-gray-400 text-sm" data-i18n="replay.loading">Loading...</div>
        </div>

        <div id="replay-viewer" class="hidden mt-4">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                <button type="button" id="replay-back-list" class="bg-gray-700 hover:bg-gray-600 text-white text-xs font-bold py-1.5 px-2 rounded" data-i18n="replay.list">Match list</button>
                <div id="replay-meta" class="text-sm text-gray-200"></div>
            </div>
            <div id="replay-status" class="text-sm text-amber-200 mb-2"></div>
            <div class="flex justify-center">
                <div id="battle-canvas-container" class="bg-gray-900/80 rounded border border-gray-600"></div>
            </div>
            <div class="flex flex-wrap items-center justify-center gap-2 mt-3">
                <button type="button" id="replay-start" class="bg-gray-700 hover:bg-gray-600 text-white text-sm font-bold px-3 py-1.5 rounded" data-i18n="replay.start">Start</button>
                <button type="button" id="replay-back" class="bg-gray-700 hover:bg-gray-600 text-white text-sm font-bold px-3 py-1.5 rounded" data-i18n="replay.back">Back</button>
                <button type="button" id="replay-play" class="bg-green-700 hover:bg-green-600 text-white text-sm font-bold px-4 py-1.5 rounded" data-i18n="replay.play">Play</button>
                <button type="button" id="replay-forward" class="bg-gray-700 hover:bg-gray-600 text-white text-sm font-bold px-3 py-1.5 rounded" data-i18n="replay.forward">Forward</button>
                <button type="button" id="replay-end" class="bg-gray-700 hover:bg-gray-600 text-white text-sm font-bold px-3 py-1.5 rounded" data-i18n="replay.toEnd">End</button>
                <span id="replay-step" class="text-sm text-yellow-300 font-semibold min-w-[7rem] text-center"></span>
            </div>
        </div>
    </div>
    <script type="module" src="replay.js"></script>
</body>
</html>
