<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategy Chess - Team Selection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'blue-team': '#3B82F6',
                        'red-team': '#EF4444',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div id="selection-screen" class="container mx-auto px-3 py-3">
        <div class="flex items-center justify-between gap-3 mb-3">
            <h1 class="text-2xl font-bold text-yellow-400">Strategy Chess</h1>
            <button id="global-start-btn"
                    class="bg-green-600 hover:bg-green-700 disabled:bg-gray-600 disabled:cursor-not-allowed text-white font-bold py-2 px-6 rounded-lg">
                Start Battle
            </button>
        </div>

        <!-- AI Settings: ghim trên để không phải cuộn -->
        <div class="bg-gray-800 border border-green-600 rounded-lg px-3 py-2 mb-3">
            <div class="flex flex-wrap items-center gap-3">
                <span class="text-sm font-semibold text-green-400 whitespace-nowrap">AI</span>
                <div id="ai-side-selection" class="flex flex-wrap gap-1">
                    <button data-mode="off"   class="ai-side-btn bg-gray-700 hover:bg-gray-600 border-2 border-transparent rounded px-2 py-1 text-xs">Không dùng AI</button>
                    <button data-mode="red"   class="ai-side-btn bg-gray-700 hover:bg-gray-600 border-2 border-transparent rounded px-2 py-1 text-xs">AI cầm ĐỎ</button>
                    <button data-mode="blue"  class="ai-side-btn bg-gray-700 hover:bg-gray-600 border-2 border-transparent rounded px-2 py-1 text-xs">AI cầm XANH</button>
                    <button data-mode="both"  class="ai-side-btn bg-gray-700 hover:bg-gray-600 border-2 border-transparent rounded px-2 py-1 text-xs">AI đấu AI</button>
                </div>
                <span class="hidden md:inline text-gray-600">|</span>
                <div id="ai-time-selection" class="flex flex-wrap gap-1">
                    <button data-ms="1000"  class="ai-time-btn bg-gray-700 hover:bg-gray-600 border-2 border-transparent rounded px-2 py-1 text-xs">1s</button>
                    <button data-ms="3000"  class="ai-time-btn bg-gray-700 hover:bg-gray-600 border-2 border-transparent rounded px-2 py-1 text-xs">3s</button>
                    <button data-ms="6000"  class="ai-time-btn bg-gray-700 hover:bg-gray-600 border-2 border-transparent rounded px-2 py-1 text-xs">6s</button>
                    <button data-ms="10000" class="ai-time-btn bg-gray-700 hover:bg-gray-600 border-2 border-transparent rounded px-2 py-1 text-xs">10s</button>
                </div>
                <p class="text-xs text-gray-500 ml-auto">Trong trận: <span class="text-gray-300">a</span> auto-play, <span class="text-gray-300">d</span> đi 1 nước</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
            <!-- BLUE TEAM -->
            <div class="bg-blue-900/30 border border-blue-500 rounded-lg p-3">
                <div class="flex items-center gap-3 mb-2">
                    <h2 class="text-lg font-bold text-blue-400">BLUE</h2>
                    <input type="text" id="blue-team-name" value="BLUE"
                           class="flex-1 bg-blue-800/50 border border-blue-400 rounded px-2 py-0.5 text-sm text-blue-100">
                </div>
                <h3 class="text-xs font-semibold text-blue-300 mb-1">Hero</h3>
                <div id="blue-hero-selection" class="grid grid-cols-6 gap-1 mb-2"></div>
                <h3 class="text-xs font-semibold text-blue-300 mb-1">
                    Quân thường <span id="blue-unit-counter" class="text-blue-200">(0/5)</span>
                </h3>
                <div id="blue-units-selection" class="grid grid-cols-3 gap-1 mb-2"></div>
                <div id="blue-units-selected" class="flex flex-wrap gap-1 min-h-[36px]"></div>
            </div>

            <!-- RED TEAM -->
            <div class="bg-red-900/30 border border-red-500 rounded-lg p-3">
                <div class="flex items-center gap-3 mb-2">
                    <h2 class="text-lg font-bold text-red-400">RED</h2>
                    <input type="text" id="red-team-name" value="RED"
                           class="flex-1 bg-red-800/50 border border-red-400 rounded px-2 py-0.5 text-sm text-red-100">
                </div>
                <h3 class="text-xs font-semibold text-red-300 mb-1">Hero</h3>
                <div id="red-hero-selection" class="grid grid-cols-6 gap-1 mb-2"></div>
                <h3 class="text-xs font-semibold text-red-300 mb-1">
                    Quân thường <span id="red-unit-counter" class="text-red-200">(0/5)</span>
                </h3>
                <div id="red-units-selection" class="grid grid-cols-3 gap-1 mb-2"></div>
                <div id="red-units-selected" class="flex flex-wrap gap-1 min-h-[36px]"></div>
            </div>
        </div>

        <div class="mt-3 bg-gray-800 rounded-lg p-3">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold text-yellow-400">Live Chat</h3>
                <div class="flex items-center space-x-4">
                    <span id="online-count" class="text-xs text-gray-300">Online: 0</span>
                    <button id="toggle-chat" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-xs">
                        Toggle Chat
                    </button>
                </div>
            </div>
            <div id="chat-container" class="hidden mt-3">
                <div id="chat-messages" class="bg-gray-900 rounded p-3 h-40 overflow-y-auto mb-3 border border-gray-600">
                    <div class="text-center text-gray-500 text-sm">Loading messages...</div>
                </div>
                <div class="flex space-x-2">
                    <input type="text" id="chat-input"
                           placeholder="Type your message..."
                           class="flex-1 bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white placeholder-gray-400 focus:outline-none focus:border-blue-500">
                    <button id="send-message" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Send</button>
                </div>
                <div class="mt-3 flex items-center space-x-2">
                    <span class="text-sm text-gray-300">Username:</span>
                    <input type="text" id="username-input" placeholder="Your username"
                           class="bg-gray-700 border border-gray-600 rounded px-3 py-1 text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 text-sm">
                    <button id="change-username" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-sm">Change</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Battle: HUD HTML chiếm chiều ngang, canvas chỉ còn bàn cờ -->
    <div id="battle-screen" class="hidden fixed inset-0 bg-gray-900 z-50 flex flex-col">
        <header class="flex-shrink-0 bg-gray-800 border-b border-gray-700 px-3 py-2 flex items-center gap-3">
            <button id="back-to-selection" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 px-3 rounded text-sm whitespace-nowrap">
                ← Back
            </button>
            <span class="text-yellow-400 font-bold text-sm whitespace-nowrap">Battle</span>
            <div id="ai-status-line" class="flex-1 min-w-0 truncate font-mono text-sm text-amber-200">AI: sẵn sàng</div>
            <span id="ai-hotkeys" class="text-xs text-gray-400 whitespace-nowrap hidden sm:inline">[a] auto · [d] 1 nước</span>
            <button id="end-turn-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-1.5 px-3 rounded text-sm whitespace-nowrap">
                End Turn
            </button>
        </header>

        <div class="flex-1 flex min-h-0">
            <aside id="blue-battle-aside" class="w-56 xl:w-64 flex-shrink-0 bg-gray-800 border-r border-blue-600 overflow-y-auto p-3 flex flex-col gap-3">
                <div id="blue-team-header"></div>
                <div id="blue-team-units" class="space-y-1"></div>
            </aside>

            <div class="flex-1 flex items-center justify-center min-w-0 p-2 bg-gray-900">
                <div id="battle-canvas-container" class="w-full h-full flex items-center justify-center"></div>
            </div>

            <aside id="red-battle-aside" class="w-56 xl:w-64 flex-shrink-0 bg-gray-800 border-l border-red-600 overflow-y-auto p-3 flex flex-col gap-3">
                <div id="red-team-header"></div>
                <div id="red-team-units" class="space-y-1"></div>
                <div id="current-unit-panel" class="mt-auto bg-gray-700/60 border border-gray-500 rounded p-2 cursor-pointer" title="Bấm để bỏ chọn quân"></div>
            </aside>
        </div>
    </div>

    <script src="play-with-ai.js"></script>
</body>
</html>
