<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Strategy Chess - Team Selection</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/imgs/ui/logo.png">
    <link rel="stylesheet" href="/brand.css">
    <meta name="description" content="Strategy Chess — epic battles begin">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Strategy Chess">
    <meta property="og:title" content="Strategy Chess">
    <meta property="og:description" content="Strategy Chess — epic battles begin">
    <meta property="og:image" content="/imgs/ui/strategy-chess-og-image.png">
    <meta property="og:image:alt" content="Strategy Chess">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Strategy Chess">
    <meta name="twitter:description" content="Strategy Chess — epic battles begin">
    <meta name="twitter:image" content="/imgs/ui/strategy-chess-og-image.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'blue-team': '#3B82F6',
                        'red-team': '#EF4444',
                    }
                }
            }
        }
    </script>
    <style>
        #battle-canvas-container canvas {
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .safe-top { padding-top: max(0.5rem, env(safe-area-inset-top)); }
        .safe-bottom { padding-bottom: max(0.5rem, env(safe-area-inset-bottom)); }
        @media (max-width: 767px) {
            #blue-battle-aside, #red-battle-aside { display: none !important; }
        }
    </style>
</head>
<body class="text-white min-h-screen">
    <div id="selection-screen" class="container mx-auto px-3 py-3 pb-24 md:pb-3">
        <div class="flex items-center justify-between gap-3 mb-3">
            <div class="flex items-center gap-2 min-w-0">
                <a href="index.html" id="back-to-home" class="bg-gray-700 hover:bg-gray-600 text-white text-xs font-bold py-1.5 px-2 rounded whitespace-nowrap" data-i18n="nav.back">← Home</a>
                <img src="/imgs/ui/logo.png" alt="Strategy Chess" class="site-logo-sm">
            </div>
            <div class="flex items-center gap-1">
                <button type="button" data-lang-set="vi" class="px-2 py-1 rounded text-xs font-bold bg-gray-700">VI</button>
                <button type="button" data-lang-set="en" class="px-2 py-1 rounded text-xs font-bold bg-gray-700">EN</button>
                <button type="button" data-open-rules class="bg-yellow-600 hover:bg-yellow-500 text-gray-900 font-bold px-2 py-1 rounded text-xs" data-i18n="nav.rules">Rules</button>
                <button id="global-start-btn"
                    class="hidden md:inline-flex bg-green-600 hover:bg-green-700 disabled:bg-gray-600 disabled:cursor-not-allowed text-white font-bold py-2 px-6 rounded-lg" data-i18n="ai.start">
                Start Battle
                </button>
            </div>
        </div>

        <div class="bg-gray-800/90 border border-green-600 rounded-lg px-3 py-2 mb-3 sticky top-0 z-20">
            <div class="flex flex-wrap items-center gap-2">
                <span class="text-sm font-semibold text-green-400 whitespace-nowrap">AI</span>
                <div id="ai-side-selection" class="flex flex-wrap gap-1">
                    <button data-mode="off"   class="ai-side-btn bg-gray-700 hover:bg-gray-600 border-2 border-transparent rounded px-2 py-1 text-xs" data-i18n="ai.none">No AI</button>
                    <button data-mode="red"   class="ai-side-btn bg-gray-700 hover:bg-gray-600 border-2 border-transparent rounded px-2 py-1 text-xs" data-i18n="ai.red">Red</button>
                    <button data-mode="blue"  class="ai-side-btn bg-gray-700 hover:bg-gray-600 border-2 border-transparent rounded px-2 py-1 text-xs" data-i18n="ai.blue">Blue</button>
                    <button data-mode="both"  class="ai-side-btn bg-gray-700 hover:bg-gray-600 border-2 border-transparent rounded px-2 py-1 text-xs" data-i18n="ai.both">AI vs AI</button>
                </div>
                <div id="ai-time-selection" class="flex flex-wrap gap-1">
                    <button data-ms="1000"  class="ai-time-btn bg-gray-700 hover:bg-gray-600 border-2 border-transparent rounded px-2 py-1 text-xs">1s</button>
                    <button data-ms="3000"  class="ai-time-btn bg-gray-700 hover:bg-gray-600 border-2 border-transparent rounded px-2 py-1 text-xs">3s</button>
                    <button data-ms="6000"  class="ai-time-btn bg-gray-700 hover:bg-gray-600 border-2 border-transparent rounded px-2 py-1 text-xs">6s</button>
                    <button data-ms="10000" class="ai-time-btn bg-gray-700 hover:bg-gray-600 border-2 border-transparent rounded px-2 py-1 text-xs">10s</button>
                </div>
                <p class="text-xs text-gray-500 hidden md:block ml-auto" data-i18n="ai.hotkeys">In battle: a auto, d one move</p>
            </div>
        </div>

        <div class="flex md:hidden gap-2 mb-2">
            <button type="button" data-team-tab="blue" class="team-tab flex-1 py-2 rounded bg-blue-700 font-bold">BLUE</button>
            <button type="button" data-team-tab="red" class="team-tab flex-1 py-2 rounded bg-gray-700 font-bold">RED</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
            <div id="blue-team-panel" class="team-panel bg-blue-900/30 border border-blue-500 rounded-lg p-3 md:block">
                <div class="flex items-center gap-3 mb-2">
                    <h2 class="text-lg font-bold text-blue-400">BLUE</h2>
                    <input type="text" id="blue-team-name" value="BLUE"
                           class="flex-1 bg-blue-800/50 border border-blue-400 rounded px-2 py-0.5 text-sm text-blue-100">
                </div>
                <div id="blue-hero-picked" class="mb-2 min-h-[52px]"></div>
                <h3 class="text-xs font-semibold text-blue-300 mb-1" data-i18n="ai.hero">Hero</h3>
                <div id="blue-hero-selection" class="grid grid-cols-3 sm:grid-cols-6 gap-1 mb-2"></div>
                <h3 class="text-xs font-semibold text-blue-300 mb-1">
                    <span data-i18n="ai.regular">Regular units</span> <span id="blue-unit-counter" class="text-blue-200">(0/5)</span>
                </h3>
                <div id="blue-units-selection" class="grid grid-cols-3 gap-1 mb-2"></div>
                <div id="blue-units-selected" class="flex flex-wrap gap-1 min-h-[36px]"></div>
            </div>

            <div id="red-team-panel" class="team-panel bg-red-900/30 border border-red-500 rounded-lg p-3 hidden md:block">
                <div class="flex items-center gap-3 mb-2">
                    <h2 class="text-lg font-bold text-red-400">RED</h2>
                    <input type="text" id="red-team-name" value="RED"
                           class="flex-1 bg-red-800/50 border border-red-400 rounded px-2 py-0.5 text-sm text-red-100">
                </div>
                <div id="red-hero-picked" class="mb-2 min-h-[52px]"></div>
                <h3 class="text-xs font-semibold text-red-300 mb-1" data-i18n="ai.hero">Hero</h3>
                <div id="red-hero-selection" class="grid grid-cols-3 sm:grid-cols-6 gap-1 mb-2"></div>
                <h3 class="text-xs font-semibold text-red-300 mb-1">
                    <span data-i18n="ai.regular">Regular units</span> <span id="red-unit-counter" class="text-red-200">(0/5)</span>
                </h3>
                <div id="red-units-selection" class="grid grid-cols-3 gap-1 mb-2"></div>
                <div id="red-units-selected" class="flex flex-wrap gap-1 min-h-[36px]"></div>
            </div>
        </div>

        <div class="mt-3 bg-gray-800 rounded-lg p-3">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold text-yellow-400" data-i18n="ai.liveChat">Live Chat</h3>
                <div class="flex items-center space-x-4">
                    <span id="online-count" class="text-xs text-gray-300">Online: 0</span>
                    <button id="toggle-chat" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-xs" data-i18n="home.chat">Chat</button>
                </div>
            </div>
            <div id="chat-container" class="hidden mt-3">
                <div id="chat-messages" class="bg-gray-900 rounded p-3 h-40 overflow-y-auto mb-3 border border-gray-600">
                    <div class="text-center text-gray-500 text-sm" data-i18n="chat.loading">Loading messages...</div>
                </div>
                <div class="flex space-x-2">
                    <input type="text" id="chat-input" data-i18n-placeholder="home.typeMessage" placeholder="Type your message..."
                           class="flex-1 bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white placeholder-gray-400 focus:outline-none focus:border-blue-500">
                    <button id="send-message" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded" data-i18n="home.send">Send</button>
                </div>
            </div>
        </div>

        <div class="text-center mt-4 mb-2">
            <button type="button" data-open-about class="text-yellow-400 hover:text-yellow-300 text-sm font-semibold" data-i18n="about.footer">Legos 2026</button>
        </div>

        <div class="md:hidden fixed bottom-0 inset-x-0 z-30 bg-gray-900/95 border-t border-gray-700 px-3 py-2 safe-bottom">
            <button id="global-start-btn-mobile"
                    class="w-full bg-green-600 hover:bg-green-700 disabled:bg-gray-600 disabled:cursor-not-allowed text-white font-bold py-3 rounded-lg">
                <span data-i18n="ai.start">Start Battle</span>
            </button>
        </div>
    </div>

    <div id="battle-screen" class="hidden fixed inset-0 bg-gray-900 z-50 flex flex-col">
        <header class="flex-shrink-0 bg-gray-800 border-b border-gray-700 px-2 py-1.5 flex items-center gap-2 safe-top">
            <button id="back-to-selection" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 px-2 rounded text-sm whitespace-nowrap" data-i18n="ai.back">Back</button>
            <div id="mobile-mp" class="md:hidden flex items-center gap-2 text-xs font-bold">
                <span id="mobile-mp-blue" class="text-blue-300">B 0</span>
                <span id="mobile-mp-red" class="text-red-300">R 0</span>
            </div>
            <div id="ai-status-line" class="flex-1 min-w-0 truncate font-mono text-xs sm:text-sm text-amber-200" data-i18n="ai.ready">AI: ready</div>
            <button id="ai-auto-btn" class="bg-gray-700 hover:bg-gray-600 text-white text-xs px-2 py-1.5 rounded whitespace-nowrap" data-i18n="ai.auto">Auto</button>
            <button id="ai-step-btn" class="bg-gray-700 hover:bg-gray-600 text-white text-xs px-2 py-1.5 rounded whitespace-nowrap" data-i18n="ai.step">Step</button>
            <button id="end-turn-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-1.5 px-2 rounded text-sm whitespace-nowrap" data-i18n="ai.end">End</button>
        </header>

        <div class="flex-1 flex min-h-0">
            <aside id="blue-battle-aside" class="hidden md:flex w-48 xl:w-56 flex-shrink-0 bg-gray-800 border-r border-blue-600 overflow-y-auto p-3 flex-col gap-3">
                <div id="blue-team-header"></div>
                <div id="blue-team-units" class="space-y-1"></div>
            </aside>

            <div class="flex-1 flex items-center justify-center min-w-0 p-1 sm:p-2 bg-gray-900">
                <div id="battle-canvas-container" class="w-full h-full flex items-center justify-center"></div>
            </div>

            <aside id="red-battle-aside" class="hidden md:flex w-48 xl:w-56 flex-shrink-0 bg-gray-800 border-l border-red-600 overflow-y-auto p-3 flex-col gap-3">
                <div id="red-team-header"></div>
                <div id="red-team-units" class="space-y-1"></div>
                <div id="current-unit-panel" class="mt-auto bg-gray-700/60 border border-gray-500 rounded p-2 cursor-pointer" data-i18n-title="ai.deselectTitle" title="Tap to deselect"></div>
            </aside>
        </div>

        <div id="battle-mobile-bar" class="md:hidden flex-shrink-0 bg-gray-800 border-t border-gray-700 px-2 py-2 safe-bottom">
            <div id="mobile-current-unit" class="flex items-center gap-2 mb-2 min-h-[40px] text-xs text-gray-400"></div>
            <div id="mobile-roster" class="flex gap-1 overflow-x-auto pb-1"></div>
        </div>
    </div>

    <script type="module" src="play-with-ai.js"></script>
</body>
</html>
