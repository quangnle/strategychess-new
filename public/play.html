<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Strategy Chess - Multiplayer Game</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/imgs/ui/logo.png">
    <link rel="stylesheet" href="/brand.css">
    <meta name="description" content="Strategy Chess — epic battles begin">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Strategy Chess">
    <meta property="og:title" content="Strategy Chess">
    <meta property="og:description" content="Strategy Chess — epic battles begin">
    <meta property="og:image" content="/imgs/ui/strategy-chess-og-image.png">
    <meta property="og:image:alt" content="Strategy Chess">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Strategy Chess">
    <meta name="twitter:description" content="Strategy Chess — epic battles begin">
    <meta name="twitter:image" content="/imgs/ui/strategy-chess-og-image.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        /* Custom styles for game UI */
        .game-panel {
            background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
        }
        .player-panel {
            transition: all 0.3s ease;
        }
        .active-turn {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            border: 2px solid #3b82f6;
        }
        .chat-panel {
            backdrop-filter: blur(10px);
            background: rgba(31, 41, 55, 0.9);
        }
        
        /* Responsive canvas container */
        #game-canvas-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            min-height: 400px;
            touch-action: none; /* Prevent default touch behaviors */
            -webkit-touch-callout: none; /* Prevent callout on iOS */
            -webkit-user-select: none; /* Prevent text selection */
            user-select: none;
        }
        
        /* Mobile-specific adjustments */
        @media (max-width: 768px) {
            #game-canvas-container {
                min-height: 400px;
                margin: 0 5px; /* 5px margin each side */
                height: calc(100vh - 150px); /* Use most of viewport height */
            }
            
            /* Ensure canvas doesn't overflow on mobile */
            .game-panel {
                max-width: 100vw;
                height: 100%;
                overflow: hidden;
            }
            
            aside.desktop-aside {
                display: none !important;
            }
            main {
                flex-direction: column;
            }
            .bg-gray-800.border-t {
                padding: 8px;
            }
        }
        
        /* Tablet adjustments */
        @media (min-width: 769px) and (max-width: 1024px) {
            #game-canvas-container {
                min-height: 350px;
                padding: 12px;
            }
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col overflow-hidden">
    <!-- Game Header -->
    <header class="bg-gray-800 border-b border-gray-700 py-2 flex-shrink-0" style="padding-top: max(0.5rem, env(safe-area-inset-top));">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between">
                <!-- Game Info -->
                <div class="flex items-center gap-2">
                    <button type="button" id="header-back-home"
                            class="bg-gray-700 hover:bg-gray-600 text-white text-xs font-bold py-1.5 px-2 rounded whitespace-nowrap" data-i18n="nav.back">← Home</button>
                    <div>
                        <img src="/imgs/ui/logo.png" alt="Strategy Chess" class="site-logo-sm">
                        <div class="flex gap-1 mt-1">
                            <button type="button" data-lang-set="vi" class="px-2 py-0.5 rounded text-[10px] font-bold bg-gray-700">VI</button>
                            <button type="button" data-lang-set="en" class="px-2 py-0.5 rounded text-[10px] font-bold bg-gray-700">EN</button>
                        </div>
                    </div>
                </div>
                
                <!-- Game Controls -->
                <div class="flex items-center space-x-4">
                    <!-- Action Buttons -->
                    <div class="flex space-x-2">
                        <button id="skip-turn-btn" 
                                class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded transition-colors"
                                style="display: none;">
                            <span data-i18n="play.skip">Skip Turn</span>
                        </button>
                        <button id="leave-game-btn" 
                                class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-2 rounded transition-colors" data-i18n="play.leave">
                            Leave
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Game Area -->
    <main class="flex-1 flex overflow-hidden">
        <!-- Left Sidebar - Player Info -->
        <aside class="desktop-aside w-64 bg-gray-800 border-r border-gray-700 flex-shrink-0 hidden lg:block">
            <div class="p-4 space-y-4">
                <!-- Your Team -->
                <div id="player-team-panel" class="player-panel bg-blue-900/30 border border-blue-500 rounded-lg p-3">
                    <div class="text-center mb-3">
                        <div class="text-blue-400 font-bold" data-i18n="play.you">YOU</div>
                        <div id="player-username" class="text-sm text-blue-200">Loading...</div>
                    </div>
                    <div id="player-team-units" class="space-y-1">
                        <!-- Units will be populated here -->
                    </div>
                </div>

                <!-- Opponent Team -->
                <div id="opponent-team-panel" class="player-panel bg-red-900/30 border border-red-500 rounded-lg p-3">
                    <div class="text-center mb-3">
                        <div class="text-red-400 font-bold" data-i18n="play.opponent">OPPONENT</div>
                        <div id="opponent-username" class="text-sm text-red-200">Loading...</div>
                    </div>
                    <div id="opponent-team-units" class="space-y-1">
                        <!-- Units will be populated here -->
                    </div>
                </div>

                <!-- Game Stats -->
                <div class="bg-gray-700 rounded-lg p-3">
                    <div class="text-yellow-400 font-bold mb-2" data-i18n="play.gameInfo">Game Info</div>
                    <div class="text-xs space-y-1">
                        <div><span data-i18n="play.round">Round:</span> <span id="round-number">0</span></div>
                        <div><span data-i18n="play.turn">Turn:</span> <span id="turn-number">0</span></div>
                        <div><span data-i18n="play.time">Time:</span> <span id="game-time">00:00</span></div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Game Board Area -->
        <div class="flex-1 flex flex-col">

            <!-- Game Canvas Container -->
            <div class="flex-1 flex items-center justify-center p-4">
                <div class="game-panel rounded-lg shadow-2xl">
                    <div id="game-canvas-container" class="relative">
                        <!-- P5.js canvas will be created here -->
                        <div id="loading-overlay" class="absolute inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center">
                            <div class="text-center">
                                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-yellow-400 mx-auto mb-4"></div>
                                <div class="text-yellow-400 font-bold" data-i18n="play.loading">Loading Game...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-gray-800 border-t border-gray-700 p-2 hidden md:block">
                <div class="flex items-center justify-between">
                    <div id="action-info" class="text-sm text-gray-400" data-i18n="play.selectHint">
                        Select a unit to see available actions
                    </div>
                    <div class="flex space-x-2">
                        <div id="selected-unit-info" class="text-sm"></div>
                    </div>
                </div>
            </div>

            <div id="battle-mobile-bar" class="md:hidden flex-shrink-0 bg-gray-800 border-t border-gray-700 px-2 py-2" style="padding-bottom: max(0.5rem, env(safe-area-inset-bottom));">
                <div id="mobile-current-unit" class="flex items-center gap-2 mb-2 min-h-[36px] text-xs text-gray-400"></div>
                <div id="mobile-roster" class="flex gap-1 overflow-x-auto pb-1"></div>
            </div>
        </div>

        <!-- Right Sidebar - Chat and Game Log -->
        <aside class="desktop-aside w-80 bg-gray-800 border-l border-gray-700 flex-shrink-0 hidden xl:flex flex-col">
            <!-- Chat Section -->
            <div class="flex-1 flex flex-col">
                <div class="bg-gray-700 p-3 border-b border-gray-600">
                    <h3 class="font-bold text-yellow-400" data-i18n="play.gameChat">Game Chat</h3>
                </div>
                <div id="chat-messages" class="flex-1 overflow-y-auto p-3 space-y-2 max-h-60">
                    <div class="text-center text-gray-500 text-sm" data-i18n="play.chatConnected">Chat connected</div>
                </div>
                <div class="p-3 border-t border-gray-600">
                    <div class="flex space-x-2">
                        <input type="text" id="chat-input" 
                                    data-i18n-placeholder="home.typeMessage"
                                    placeholder="Type message..."
                               class="flex-1 bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 text-sm">
                        <button id="send-message" 
                                class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm transition-colors">
                            <span data-i18n="home.send">Send</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Game Log Section -->
            <div class="flex-1 flex flex-col border-t border-gray-700">
                <div class="bg-gray-700 p-3 border-b border-gray-600">
                    <h3 class="font-bold text-yellow-400" data-i18n="play.gameLog">Game Log</h3>
                </div>
                <div id="game-log" class="flex-1 overflow-y-auto p-3 space-y-1 text-xs">
                    <div class="text-center text-gray-500" data-i18n="play.logEmpty">Game log will appear here</div>
                </div>
            </div>
        </aside>
    </main>

    <!-- Mobile Chat Panel (Floating) -->
    <div id="mobile-chat-panel" class="xl:hidden fixed bottom-4 right-4 w-80 chat-panel rounded-lg shadow-lg border border-gray-600 hidden">
        <div class="flex items-center justify-between p-3 border-b border-gray-600">
            <h3 class="font-bold text-yellow-400" data-i18n="home.chat">Chat</h3>
            <button id="close-mobile-chat" class="text-gray-400 hover:text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <div id="mobile-chat-messages" class="h-48 overflow-y-auto p-3 space-y-2">
            <!-- Chat messages -->
        </div>
        <div class="p-3 border-t border-gray-600">
            <div class="flex space-x-2">
                <input type="text" id="mobile-chat-input" 
                                    data-i18n-placeholder="home.typeMessage"
                                    placeholder="Type message..."
                       class="flex-1 bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 text-sm">
                <button id="mobile-send-message" 
                        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm">
                    <span data-i18n="home.send">Send</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Chat Toggle Button -->
    <button id="mobile-chat-toggle" class="xl:hidden fixed bottom-28 left-4 bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-full shadow-lg z-40">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
        </svg>
    </button>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="hidden fixed inset-0 bg-black bg-opacity-75 z-50 flex items-center justify-center">
        <div class="bg-gray-800 rounded-lg p-8 max-w-md w-full mx-4 border border-gray-600">
            <div class="text-center">
                <h2 class="text-3xl font-bold text-yellow-400 mb-4" data-i18n="play.gameOver">Game Over!</h2>
                <div id="game-result" class="text-lg mb-6">
                    <!-- Game result will be populated here -->
                </div>
                <div class="space-y-3">
                    <button id="play-again-btn" 
                            class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition-colors">
                        <span data-i18n="play.playAgain">Play Again</span>
                    </button>
                    <button id="back-to-main-btn" 
                            class="w-full bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-6 rounded-lg transition-colors" data-i18n="play.backMenu">
                        Back to Main Menu
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Connection Lost Modal -->
    <div id="connection-lost-modal" class="hidden fixed inset-0 bg-black bg-opacity-75 z-50 flex items-center justify-center">
        <div class="bg-gray-800 rounded-lg p-8 max-w-md w-full mx-4 border border-red-600">
            <div class="text-center">
                <h2 class="text-2xl font-bold text-red-400 mb-4" data-i18n="play.connLost">Connection Lost</h2>
                <p class="text-gray-300 mb-6" data-i18n="play.connLostBody">
                    Connection to the game server was lost. Attempting to reconnect...
                </p>
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-red-400 mx-auto"></div>
            </div>
        </div>
    </div>

    <script type="module" src="play.js"></script>
</body>
</html>
